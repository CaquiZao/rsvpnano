vault_path   = "C:/Users/kakam/OneDrive/Área de Trabalho/CAQUI BRAIN/07 Library"
audio_store  = "C:/Users/kakam/.handy-bridge/audio"
port         = 8787

[asr]
handy_exe = "C:/Users/kakam/AppData/Local/Handy/handy.exe"
model     = "handy-computer/nemotron-3.5-asr-streaming-0.6b-gguf/nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf"
timeout_s = 900
# Quais dispositivos tentar, em ordem, caindo para o proximo quando um
# morre. Vazio (ou ausente) deixa o Handy escolher. Existe porque o buffer
# que o backend Vulkan aloca cresce com a duracao do audio: uma GPU de 2GB
# transcreve um minuto e estoura em dois. `handy.exe --list-devices` lista
# os indices com a memoria de cada um.
# device_indexes = [1, 2]

[post_process]
enabled = true
backend = "claude_cli"          # claude_cli | anthropic_api | ollama | none
model   = "claude-haiku-4-5-20251001"
# Responde de imediato as duvidas conceituais que der. Custa uma segunda chamada
# por nota que tenha alguma pergunta respondivel.
answer_tasks = true

[kanban]
enabled   = true

[summaries]
# Resumo por capitulo e resumo do livro, alimentados so pelo que voce registrou.
enabled    = true
# "nota"     -> regenera o resumo do capitulo a cada gravacao nele. Mais fresco,
#               custa uma chamada de `claude -p` por nota.
# "capitulo" -> espera a leitura passar do capitulo. Cerca de uma chamada por
#               capitulo em vez de uma por nota.
chapter_on = "nota"

[telegram]
# Crie um bot com o @BotFather (/newbot) e cole o token aqui.
# Para o chat_id, fale com o bot e abra
# https://api.telegram.org/bot<TOKEN>/getUpdates
enabled = false
token   = ""
chat_id = ""

[digest]
# Lembrete semanal do que continua em aberto nos quadros. Sem ele, a raia
# Triagem acumula e voce para de confiar no quadro.
enabled = true
weekday = 6                     # 0 = segunda ... 6 = domingo
hour    = 19

[drive]
# Rota de queda: quando o device nao acha o bridge na rede, ele sobe a gravacao
# para uma pasta do Google Drive em vez de perder a nota. Desligado por padrao
# -- quem so usa o bridge na propria rede nao precisa criar projeto no Google
# Cloud para nada. Para habilitar, rode
# `uv run python -m handy_bridge.drive_auth --config config.toml` depois de
# preencher client_id/client_secret, e veja "Quando o bridge nao esta na rede"
# no README.
enabled         = false
client_id       = ""
client_secret   = ""
refresh_token   = ""
folder_id       = ""
poll_s          = 30
