vault_path   = "C:/Users/kakam/OneDrive/Área de Trabalho/Reading"
inbox_folder = "Inbox"
audio_store  = "C:/Users/kakam/.handy-bridge/audio"
port         = 8787

[asr]
handy_exe = "C:/Users/kakam/AppData/Local/Handy/handy.exe"
model     = "handy-computer/nemotron-3.5-asr-streaming-0.6b-gguf/nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf"
timeout_s = 900

[post_process]
enabled = true
backend = "claude_cli"          # claude_cli | anthropic_api | ollama | none
model   = "claude-haiku-4-5-20251001"
# Responde de imediato as duvidas conceituais que der. Custa uma segunda chamada
# por nota que tenha alguma pergunta respondivel.
answer_tasks = true

[kanban]
enabled   = true
subfolder = "Quadros"           # um quadro por livro, mais Geral.md para notas soltas

[telegram]
# Crie um bot com o @BotFather (/newbot) e cole o token aqui.
# Para o chat_id, fale com o bot e abra
# https://api.telegram.org/bot<TOKEN>/getUpdates
enabled = false
